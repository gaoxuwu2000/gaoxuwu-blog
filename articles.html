<div style="padding:100px 0 40px;background:linear-gradient(135deg,#f5f3ff,#ede9fe);">
  <div class="container">
    <h1 style="font-size:2rem;font-weight:700;margin-bottom:8px;font-family:'Noto Serif SC',serif;">全部文章</h1>
    <p style="color:var(--text-light);">共 <strong id="totalCount">6</strong> 篇文章，持续更新中</p>
    <!-- 搜索 -->
    <div style="margin-top:20px;display:flex;gap:10px;max-width:500px;">
      <input type="text" id="searchInput" placeholder="🔍 搜索文章标题..." oninput="filterArticles()" style="flex:1;padding:11px 16px;border:1.5px solid var(--border);border-radius:28px;font-size:.93rem;outline:none;font-family:inherit;" />
    </div>
  </div>
</div>

<section class="categories" style="position:static;">
  <div class="container">
    <div class="cat-tabs">
      <button class="cat-tab active" data-cat="all">全部</button>
      <button class="cat-tab" data-cat="tech">💻 技术</button>
      <button class="cat-tab" data-cat="life">🌱 生活</button>
      <button class="cat-tab" data-cat="finance">💰 理财</button>
      <button class="cat-tab" data-cat="growth">🧠 成长</button>
      <button class="cat-tab" data-cat="vip">👑 会员专属</button>
    </div>
  </div>
</section>

<section style="padding:40px 0 80px;">
  <div class="container">
    <div class="articles-grid" id="articleGrid"></div>
    <div id="noResult" style="display:none;text-align:center;padding:60px;color:var(--text-light);">
      <i class="fas fa-search" style="font-size:2.5rem;opacity:.3;margin-bottom:12px;display:block;"></i>

    </div>
  </div>
</section>

      <p>付费咨询：微信 gaoxuwu | 电话 15312636073</p>
    </div>
  </div>
</footer>

<div class="modal-overlay" id="payModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('payModal')">×</button>

      <p class="pay-tip">该文章为会员专属，联系博主开通：</p>
      <div class="pay-methods">
        <div class="pay-method"><i class="fab fa-weixin" style="color:#07C160"></i><span>微信：<strong>gaoxuwu</strong></span></div>
        <div class="pay-method"><i class="fas fa-phone" style="color:#1890ff"></i><span>电话：<strong>15312636073</strong></span></div>
      </div>
      <div class="pay-qr"><img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=微信:gaoxuwu" alt="二维码" /><p>扫码添加微信</p></div>

  </div>

<button class="back-to-top" id="backToTop" onclick="scrollToTop()"><i class="fas fa-arrow-up"></i></button>

<script src="js/app.js"></script>
<script>
let currentCat = 'all';
let currentSearch = '';

function filterArticles() {
  currentSearch = document.getElementById('searchInput')?.value?.toLowerCase() || '';
  renderFiltered();
}

function renderFiltered() {
  const extra = Storage.get('extraArticles') || [];
  const all = [...BLOG_DATA.articles, ...extra];
  let filtered = all;
  if (currentCat !== 'all') {
    if (currentCat === 'vip') filtered = filtered.filter(a => a.vip);
    else filtered = filtered.filter(a => a.cat === currentCat);
  }
  if (currentSearch) filtered = filtered.filter(a => a.title.toLowerCase().includes(currentSearch) || a.excerpt.toLowerCase().includes(currentSearch));

  const countEl = document.getElementById('totalCount');
  if (countEl) countEl.textContent = filtered.length;

  const grid = document.getElementById('articleGrid');
  const noResult = document.getElementById('noResult');
  if (!filtered.length) {
    grid.innerHTML = '';
    if (noResult) noResult.style.display = 'block';
    return;
  }
  if (noResult) noResult.style.display = 'none';
  grid.innerHTML = filtered.map(a => `
    <div class="article-card ${a.vip ? 'lock-overlay' : ''}" onclick="goToArticle(${a.id})">
      <img class="article-thumb" src="${a.cover}" loading="lazy" />
      <div class="article-body">
        <div class="article-meta"><span class="article-tag ${a.vip ? 'vip' : ''}">${a.tag}</span><span>${a.date}</span></div>
        <h3 class="article-title">${a.title}</h3>
        <p class="article-excerpt">${a.excerpt}</p>
        <div class="article-footer">
          <div class="article-stats">
            <span><i class="fas fa-eye"></i> ${formatNum(a.views)}</span>
            <span><i class="fas fa-heart"></i> ${formatNum(a.likes)}</span>
          </div>
          <span style="color:var(--primary);font-weight:500;font-size:.85rem">阅读全文 →</span>
        </div>
      </div>
    </div>
  `).join('');
}

document.addEventListener('DOMContentLoaded', () => {
  renderFiltered();
  document.querySelectorAll('.cat-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentCat = tab.dataset.cat;
      renderFiltered();
    });
  });
});
</script>
</body>
</html>
