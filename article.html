}

        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <button onclick="shareArticle('wechat')" style="padding:8px 18px;background:#07C160;color:white;border:none;border-radius:20px;cursor:pointer;font-size:.88rem;"><i class="fab fa-weixin"></i> 微信</button>
          <button onclick="shareArticle('weibo')" style="padding:8px 18px;background:#E6162D;color:white;border:none;border-radius:20px;cursor:pointer;font-size:.88rem;"><i class="fab fa-weibo"></i> 微博</button>
          <button onclick="copyArticleLink()" id="copyArticleBtn" style="padding:8px 18px;background:var(--primary);color:white;border:none;border-radius:20px;cursor:pointer;font-size:.88rem;"><i class="fas fa-link"></i> 复制链接</button>
        </div>
      </div>

      <!-- 推广 -->
      <div style="margin-top:28px;padding:28px;background:linear-gradient(135deg,#f5f3ff,#fce7f3);border-radius:16px;border:1px dashed var(--primary);">
        <p style="font-weight:600;margin-bottom:8px;color:var(--primary);">💰 推广这篇文章，赚取佣金</p>
        <p style="font-size:.88rem;color:var(--text-light);margin-bottom:14px;">你的专属推广链接，每成功邀请一位会员，获得30%佣金</p>
        <div style="display:flex;gap:10px;">
          <input id="articlePromoLink" type="text" style="flex:1;padding:9px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:.85rem;background:white;" readonly />
          <button onclick="copyPromoLink()" id="copyBtn" class="btn-copy">复制推广链接</button>
        </div>
      </div>
    </div>

    <!-- 相关文章 -->
    <div style="background:#fafafa;padding:60px 0;">
      <div class="container">
        <div class="section-header"><h2>相关文章</h2></div>
        <div class="articles-grid" id="relatedArticles"></div>
      </div>
    </div>

    <footer>
      <div class="container">
        <div class="footer-bottom" style="padding:20px 0;">
          <p>© 2026 高绪武博客</p>
          <p>付费咨询：微信 gaoxuwu | 电话 15312636073</p>
        </div>
      </div>
    </footer>
  `;
  page.innerHTML = html;

  // 初始化推广链接
  const promoInput = document.getElementById('articlePromoLink');
  if (promoInput) promoInput.value = generatePromoLink();

  // 相关文章
  const related = BLOG_DATA.articles.filter(a => a.id !== id).slice(0, 3);
  const relGrid = document.getElementById('relatedArticles');
  if (relGrid) {
    relGrid.innerHTML = related.map(a => `
      <div class="article-card" onclick="location.href='article.html?id=${a.id}'">
        <img class="article-thumb" src="${a.cover}" />
        <div class="article-body">
          <div class="article-meta"><span class="article-tag ${a.vip?'vip':''}">${a.tag}</span><span>${a.date}</span></div>
          <h3 class="article-title">${a.title}</h3>
          <p class="article-excerpt">${a.excerpt}</p>
        </div>
      </div>
    `).join('');
  }
});

function shareArticle(platform) {
  const url = encodeURIComponent(window.location.href);
  const title = encodeURIComponent(document.title);
  if (platform === 'weibo') window.open(`https://service.weibo.com/share/share.php?url=${url}&title=${title}`);
  else { copyToClipboard(window.location.href); showAlert('链接已复制，请粘贴到微信分享', 'success'); }
}

function copyArticleLink() {
  copyToClipboard(window.location.href);
  const btn = document.getElementById('copyArticleBtn');
  if (btn) { btn.innerHTML = '✓ 已复制'; setTimeout(() => btn.innerHTML = '<i class="fas fa-link"></i> 复制链接', 2000); }
}

function copyToClipboard(text) {
  if (navigator.clipboard) { navigator.clipboard.writeText(text); }
  else { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
}
</script>
</body>
